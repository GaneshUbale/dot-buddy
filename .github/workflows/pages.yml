name: Project page

# Builds https://doldoldol21.github.io/dot-buddy/ from README.md and README.ko.md (scripts/site.py) and publishes it.
# Runs whenever the READMEs or docs/ change on main, so the page is never edited by hand.
on:
  push:
    branches: [main]
    paths: ["README.md", "README.ko.md", "docs/**", "scripts/site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build the page
        run: python3 scripts/site.py _site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
