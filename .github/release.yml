# Categories for GitHub's auto-generated release notes (used by `gh release create --generate-notes`).
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: New features
      labels: [enhancement]
    - title: Characters
      labels: [character]
    - title: Bug fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
